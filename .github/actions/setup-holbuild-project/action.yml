name: 'Setup holbuild project'
description: 'Sets up Poly/ML and holbuild for this project'

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-polyml

    - uses: ./.github/actions/setup-holbuild
      with:
        # Includes the plain-build fix for `holbuild check` (holbuild#326).
        holbuild-ref: 0eca1572b837a2c40fa1f450d6a7fec70811c522

    - name: Report selected holbuild version
      shell: bash
      run: holbuild --version

    - name: Configure holbuild cache
      shell: bash
      run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

name: holbuild

on:
  workflow_dispatch:
  pull_request:
    # Only ready PRs into main from branches of this repository run jobs:
    # pushing a branch here needs write access, and those runs get the cache
    # login. Fork and draft PRs run nothing; the merge queue tests them. PRs
    # into other branches run nothing either; their base's own PR into main
    # tests them together.
    # ready_for_review starts CI when a draft is marked ready; converted_to_draft
    # cancels the run of a PR turned back into a draft. Omit edited: title/body
    # edits create all-skipped runs that shadow passing required checks.
    # After retargeting a ready PR to main without a push, start CI with
    # gh pr ready --undo && gh pr ready.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HBX_BASENAME: vyper-hol
  HBX_ARTEFACT_NAME: vyper-hol-hbx-${{ github.sha }}

jobs:
  build:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build project except the witnesses
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # The witnesses build in the witnesses jobs; build-rollup adds them.
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $(python3 tools/ci_targets.py build-roots)

      - name: Check external-entry theories for cheats and axioms
        run: |
          for theory in vyperABIEntriesTheory vyperExternalEntryBehaviorTheory vyperExternalEntrySourceBehaviorTheory; do
            holbuild check "$theory"
          done

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

  compiler:
    # Builds what the witnesses load besides each other, once for all
    # witness groups.
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build witness dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          targets=$(python3 tools/ci_targets.py compiler)
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

  witnesses:
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    needs: compiler
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build witness group ${{ matrix.group }}
        id: witnesses
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Groups are balanced by .github/witness-times.txt, scaled by each
          # witness's fixture count; rerun `tools/ci_targets.py witness-times`
          # when witness times drift.
          targets=$(python3 tools/ci_targets.py witnesses --group ${{ matrix.group }} --groups ${{ strategy.job-total }})
          echo "Building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild witness run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export witness group HBX
        run: holbuild export -o witnesses-${{ matrix.group }}.hbx ${{ steps.witnesses.outputs.targets }}

      - name: Upload witness group HBX
        uses: actions/upload-artifact@v7.0.1
        with:
          name: witnesses-${{ github.sha }}-${{ matrix.group }}
          path: witnesses-${{ matrix.group }}.hbx
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-rollup:
    # Adds the witness groups to what build published, builds the witness
    # rollup and exports the HBX of the whole project.
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [build, witnesses]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Download witness group HBXs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: witnesses-${{ github.sha }}-*
          path: witness-hbx
          merge-multiple: true

      - name: Import witness group HBXs
        run: |
          for archive in witness-hbx/*.hbx; do
            holbuild import "$archive"
          done

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build project with holbuild
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Bound total HOL memory on the hosted runner, including fixture builds.
          jobs=$(nproc)
          if [ "$jobs" -gt 2 ]; then jobs=2; fi
          memory_mib=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1024 / 1024 ))
          if [ "$memory_mib" -lt 12288 ]; then jobs=1; fi
          holbuild --max-heap 4096 --verbose -j"$jobs" build --skip-checkpoints --skip-proof-steps

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export HBX archive
        run: |
          archive="$HBX_BASENAME.hbx"
          holbuild export \
            -o "$archive" \
            --metadata-out "$archive.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload HBX artefact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.HBX_ARTEFACT_NAME }}
          path: |
            ${{ env.HBX_BASENAME }}.hbx
            ${{ env.HBX_BASENAME }}.hbx.json
            ${{ env.HBX_BASENAME }}.hbx.sha256
          if-no-files-found: error
          retention-days: 90

  tested:
    # On a push to main, whether a merge-group run already passed this commit:
    # the merge queue fast-forwards main to the commit it tested, so the push
    # run skips the tests and oracle and builds only to publish main's theories.
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: read
    outputs:
      merge-group-passed: ${{ steps.runs.outputs.merge-group-passed }}
    steps:
      - name: Find a successful merge-group run of this commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/holbuild.yml/runs?head_sha=${{ github.sha }}&event=merge_group&status=success" -q .total_count)
          echo "successful merge-group runs: $count"
          echo "merge-group-passed=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test-deps:
    # Builds only what the test groups load besides their own theories, so they
    # start long before build finishes.
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build test dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          targets=$(python3 tools/ci_targets.py test-deps)
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

  python-o1-oracle:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.17'

      - name: Check independent pinned-Python O1/no-assembly-opt bytecode oracle
        run: |
          python -m pip install uv==0.10.11
          pin=$(tr -d '[:space:]' < VYPER_PIN)
          git clone https://github.com/vyperlang/vyper.git vyper-src
          git -C vyper-src checkout --detach "$pin"
          sh lowering/defs/bytecode/python-o1-bytecode-fixtures --check \
            --vyper-repo vyper-src

  export-vyper-tests:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vyper-test-exports

      - name: Upload Vyper test exports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vyper-test-exports-${{ github.sha }}
          path: tests/vyper-test-exports
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  vyper-tests:
    # tested, skipped on other events than push, would skip this job through
    # the implicit success(); the result checks stand in for it.
    if: ${{ !cancelled() && needs.test-deps.result == 'success' && needs.export-vyper-tests.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [test-deps, export-vyper-tests]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Download Vyper test exports
        uses: actions/download-artifact@v8.0.1
        with:
          name: vyper-test-exports-${{ github.sha }}
          path: tests/vyper-test-exports

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Generate test theories from pinned exports
        run: |
          holbuild --max-heap 4096 build --skip-checkpoints --skip-proof-steps vyperTestLibTestTheory
          generator=$(mktemp --suffix=.sml)
          trap 'rm -f "$generator"' EXIT
          printf '%s\n' 'vyperTestLib.generate_tests ();' > "$generator"
          (cd tests && holbuild --max-heap 4096 run --noconfig vyperTestLib "$generator")

      - name: Check generated Vyper script inventory
        run: |
          holbuild --max-heap 4096 run --noconfig tests/checkGeneratedScripts.sml

      - name: Build Vyper test coverage baseline
        if: matrix.group == 0
        run: holbuild --max-heap 4096 build --skip-checkpoints --skip-proof-steps vyperTestCoverageReportTheory

      - name: Report Vyper test coverage baseline
        if: matrix.group == 0
        run: cat tests/vyper-coverage-report.txt

      - name: Run Vyper test group ${{ matrix.group }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Groups come from .github/vyper-test-groups.txt, balanced by measured
          # build time; rerun `tools/vyper_test_groups.py plan` when tests change.
          targets=$(python3 tools/vyper_test_groups.py targets --group ${{ matrix.group }} --groups ${{ strategy.job-total }})
          echo "Building: $targets"
          # Leave RAM for the runner and dependency loading, not just ML heaps.
          jobs=$(nproc)
          if [ "$jobs" -gt 2 ]; then jobs=2; fi
          memory_mib=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1024 / 1024 ))
          if [ "$memory_mib" -lt 12288 ]; then jobs=1; fi
          holbuild --max-heap 4096 --verbose -j"$jobs" build --skip-checkpoints --skip-proof-steps $targets

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild test run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

  holbuild-success:
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04-arm
    needs: [build, compiler, witnesses, build-rollup, tested, test-deps, python-o1-oracle, export-vyper-tests, vyper-tests]
    steps:
      - name: Check all jobs succeeded
        env:
          BUILD_RESULTS: ${{ needs.build.result }} ${{ needs.compiler.result }} ${{ needs.witnesses.result }} ${{ needs.build-rollup.result }}
          TEST_RESULTS: ${{ needs.test-deps.result }} ${{ needs.python-o1-oracle.result }} ${{ needs.export-vyper-tests.result }} ${{ needs.vyper-tests.result }}
          MERGE_GROUP_PASSED: ${{ needs.tested.outputs.merge-group-passed }}
        run: |
          for result in $BUILD_RESULTS; do
            [ "$result" = success ] || exit 1
          done
          for result in $TEST_RESULTS; do
            [ "$result" = success ] || { [ "$result" = skipped ] && [ "$MERGE_GROUP_PASSED" = true ]; } || exit 1
          done

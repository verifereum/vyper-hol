name: holbuild
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha && format('Approved PR {0} at {1}', inputs.pr_number, inputs.approved_sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      uncached:
        description: 'Build without restoring any cache'
        type: boolean
        default: false
      pr_number:
        description: 'PR to test (leave both PR inputs blank for an ordinary run)'
        type: string
        default: ''
      approved_sha:
        description: 'Full current head SHA approved to run with the cache login, including its local actions'
        type: string
        default: ''
  schedule:
    - cron: '0 3 * * 6'
  pull_request:
    # Only ready PRs into main from branches of this repository run jobs:
    # pushing a branch here needs write access, and those runs get the cache
    # login. Fork and draft PRs run nothing; the merge queue tests them. A PR
    # stacked on another branch runs once it is retargeted to main (edited with
    # a base change). ready_for_review starts CI when a draft is marked ready;
    # converted_to_draft cancels the run of a PR turned back into a draft.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
  push:
    branches: [main]

concurrency:
  # An edit that leaves the base alone (title, description) runs no jobs, so its
  # run gets a group of its own rather than cancelling the PR's real run, and so
  # does each approved PR run, so that approvals do not cancel each other.
  group: ${{ github.workflow }}-${{ ((github.event.action == 'edited' && !github.event.changes.base) || inputs.approved_sha) && github.run_id || github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HBX_BASENAME: vyper-hol
  # Uncached runs check that main still builds from source. Every cache key gets
  # this run's id, so no other run's entry is restored and no other run reads
  # what this one saves, and the remote cache login is withheld.
  CACHE_KEY_SUFFIX: ${{ (github.event_name == 'schedule' || inputs.uncached) && format('-uncached-{0}-{1}', github.run_id, github.run_attempt) || '' }}

jobs:
  select-source:
    # Validates a maintainer's approval of a PR head (.github/approved-fork-ci.md),
    # so it runs only on a dispatch with PR inputs. Every other run skips it, and
    # its empty outputs leave each checkout on the triggering commit.
    if: github.event_name == 'workflow_dispatch' && (inputs.pr_number || inputs.approved_sha)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      sha: ${{ steps.source.outputs.sha }}
      approved: ${{ steps.source.outputs.approved }}
    steps:
      # No checkout and no environment secrets before the approval is validated.
      - uses: actions/github-script@v8
        id: source
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          UNCACHED: ${{ inputs.uncached }}
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const number = process.env.PR_NUMBER;
            const requested = process.env.APPROVED_SHA;
            if (context.ref !== 'refs/heads/main') {
              throw new Error(`Dispatch on main so the workflow is trusted, not on ${context.ref}`);
            }
            if (process.env.UNCACHED === 'true') {
              throw new Error('An approved run uses the remote cache login, which uncached withholds; leave uncached off');
            }
            if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
              throw new Error(`Invalid PR number: ${number}`);
            }
            if (!/^[0-9a-f]{40}$/.test(requested)) {
              throw new Error(`Expected a full lowercase commit SHA, got: ${requested}`);
            }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number),
            });
            if (pr.state !== 'open' || pr.base.repo.full_name !== repository || pr.base.ref !== 'main') {
              throw new Error(`Expected an open PR into ${repository} main`);
            }
            if (!pr.head.repo || pr.head.sha !== requested) {
              throw new Error(`PR head is ${pr.head.sha}, not approved SHA ${requested}; approve its current head explicitly`);
            }
            core.setOutput('repository', pr.head.repo.full_name);
            core.setOutput('sha', requested);
            core.setOutput('approved', 'true');
            await core.summary
              .addHeading(`Approved PR ${number}`)
              .addTable([
                [{data: 'Repository', header: true}, {data: 'Commit', header: true}],
                [pr.head.repo.full_name, requested],
              ])
              .addRaw('Job definitions come from main; local actions and build inputs come from this commit.\n')
              .write();

  toolchain:
    # holbuild hashes the HOL toolchain's bytes into every action key, and two
    # HOL builds differ, so build-rollup finds the witness groups' actions only
    # if build and compiler share one toolchain. Without a project snapshot to
    # carry it, this job builds it once for build, compiler and test-deps. With
    # the remote login, holbuild restores the published HOL toolchain instead of
    # building a new one, so keys stay those of earlier runs. select-source is
    # skipped unless a PR head is approved: !cancelled() keeps that skip from
    # skipping this job and so all the others, and a failed approval stops it.
    if: ${{ !cancelled() && (needs.select-source.result == 'success' || needs.select-source.result == 'skipped') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: select-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    outputs:
      snapshot-key: ${{ steps.project.outputs.project-snapshot-key == '' && steps.cache-key.outputs.snapshot-key || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        id: project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          lookup-only: true

      - name: Compute holbuild toolchain snapshot key
        id: cache-key
        run: echo "snapshot-key=${{ steps.project.outputs.stage-prefix }}-toolchain-${{ needs.select-source.outputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Configure remote cache
        if: ${{ steps.project.outputs.project-snapshot-key == '' }}
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build schema-2 HOL toolchain
        if: ${{ steps.project.outputs.project-snapshot-key == '' }}
        run: holbuild buildhol

      - name: Save HOL toolchain snapshot
        if: ${{ steps.project.outputs.project-snapshot-key == '' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

  build:
    # A skipped job passes a required check; a no-op edit's skipped run must not
    # report under the required name over the PR's real result.
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'build (no-op edit)' || 'build' }}
    if: ${{ !cancelled() && needs.toolchain.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: [select-source, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    outputs:
      holbuild-cache-key: ${{ steps.cache-key.outputs.snapshot-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        id: project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          toolchain-snapshot-key: ${{ needs.toolchain.outputs.snapshot-key }}

      - name: Compute holbuild snapshot key
        id: cache-key
        # An approved run saves in main's cache scope, which every branch and PR
        # restores from, so its snapshot goes under the stage prefix: the exact
        # key is restored by this run's build-rollup and matches no later
        # run's restore prefix.
        run: echo "snapshot-key=${{ needs.select-source.outputs.approved == 'true' && format('{0}-build', steps.project.outputs.stage-prefix) || steps.project.outputs.build-prefix }}-${{ needs.select-source.outputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Save holbuild toolchain cache after buildhol
        # Every branch can restore main's entries, so other branches' copies
        # only fill the 10 GB cache.
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.project.outputs.toolchain-key }}

      - name: Build project except the witnesses
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # The witnesses build in the witnesses jobs; build-rollup adds them.
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $(python3 tools/ci_targets.py build-roots)

      - name: Save holbuild project snapshot
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

  compiler:
    # Builds what the witnesses load besides each other, once for all
    # witness groups.
    if: ${{ !cancelled() && needs.toolchain.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: [select-source, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    outputs:
      holbuild-cache-key: ${{ steps.cache-key.outputs.snapshot-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        id: project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          toolchain-snapshot-key: ${{ needs.toolchain.outputs.snapshot-key }}

      - name: Compute holbuild snapshot key
        id: cache-key
        run: echo "snapshot-key=${{ steps.project.outputs.stage-prefix }}-compiler-${{ needs.select-source.outputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build witness dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          targets=$(python3 tools/ci_targets.py compiler)
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

      - name: Save holbuild compiler snapshot
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

  witnesses:
    if: ${{ !cancelled() && needs.compiler.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: [select-source, compiler]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          snapshot-key: ${{ needs.compiler.outputs.holbuild-cache-key }}

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build witness group ${{ matrix.group }}
        id: witnesses
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Groups are balanced by .github/witness-times.txt, scaled by each
          # witness's fixture count; rerun `tools/ci_targets.py witness-times`
          # when witness times drift.
          targets=$(python3 tools/ci_targets.py witnesses --group ${{ matrix.group }} --groups ${{ strategy.job-total }})
          echo "Building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild witness run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export witness group HBX
        run: holbuild export -o witnesses-${{ matrix.group }}.hbx ${{ steps.witnesses.outputs.targets }}

      - name: Upload witness group HBX
        uses: actions/upload-artifact@v7.0.1
        with:
          name: witnesses-${{ github.sha }}-${{ matrix.group }}
          path: witnesses-${{ matrix.group }}.hbx
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-rollup:
    # Adds the witness groups to build's snapshot, builds the witness rollup
    # and exports the HBX of the whole project.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.witnesses.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: [select-source, build, witnesses]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          snapshot-key: ${{ needs.build.outputs.holbuild-cache-key }}

      - name: Download witness group HBXs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: witnesses-${{ github.sha }}-*
          path: witness-hbx
          merge-multiple: true

      - name: Import witness group HBXs
        run: |
          for archive in witness-hbx/*.hbx; do
            holbuild import "$archive"
          done

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build project with holbuild
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps

      - name: Save holbuild project snapshot
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ needs.build.outputs.holbuild-cache-key }}-rollup

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export HBX archive
        run: |
          archive="$HBX_BASENAME.hbx"
          holbuild export \
            -o "$archive" \
            --metadata-out "$archive.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload HBX artefact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.HBX_BASENAME }}-hbx-${{ needs.select-source.outputs.sha || github.sha }}
          path: |
            ${{ env.HBX_BASENAME }}.hbx
            ${{ env.HBX_BASENAME }}.hbx.json
            ${{ env.HBX_BASENAME }}.hbx.sha256
          if-no-files-found: error
          retention-days: 90

  tested:
    # On a push to main, whether a merge-group run already passed this commit:
    # the merge queue fast-forwards main to the commit it tested, so the push
    # run skips the tests and oracle and builds only to save main's snapshot.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      merge-group-passed: ${{ steps.runs.outputs.merge-group-passed }}
    steps:
      - name: Find a successful merge-group run of this commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/holbuild.yml/runs?head_sha=${{ github.sha }}&event=merge_group&status=success" -q .total_count)
          echo "successful merge-group runs: $count"
          echo "merge-group-passed=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test-deps:
    # Builds only what the test groups load besides their own theories, so they
    # start long before build finishes.
    needs: [select-source, toolchain, tested]
    if: ${{ !cancelled() && needs.toolchain.result == 'success' && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    outputs:
      holbuild-cache-key: ${{ steps.cache-key.outputs.snapshot-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        id: project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          toolchain-snapshot-key: ${{ needs.toolchain.outputs.snapshot-key }}

      - name: Compute holbuild snapshot key
        id: cache-key
        run: echo "snapshot-key=${{ steps.project.outputs.stage-prefix }}-test-deps-${{ needs.select-source.outputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build test dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          targets=$(python3 tools/ci_targets.py test-deps)
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

      - name: Save holbuild test dependency snapshot
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

  python-o1-oracle:
    needs: [select-source, tested]
    if: ${{ !cancelled() && (needs.select-source.result == 'success' || needs.select-source.result == 'skipped') && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.11'

      - name: Check independent pinned-Python O1/no-assembly-opt bytecode oracle
        run: |
          python -m pip install uv==0.10.11
          pin=$(tr -d '[:space:]' < VYPER_PIN)
          git clone https://github.com/vyperlang/vyper.git vyper-src
          git -C vyper-src checkout --detach "$pin"
          sh lowering/defs/bytecode/python-o1-bytecode-fixtures --check \
            --vyper-repo vyper-src

  export-vyper-tests:
    needs: [select-source, tested]
    if: ${{ !cancelled() && (needs.select-source.result == 'success' || needs.select-source.result == 'skipped') && needs.tested.outputs.merge-group-passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-24.04
    outputs:
      export-cache-key: ${{ steps.exports.outputs.export-cache-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-vyper-test-exports
        id: exports
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}

  vyper-tests:
    # tested, skipped on other events than push, would skip this job through
    # the implicit success(); the result checks stand in for it.
    if: ${{ !cancelled() && needs.test-deps.result == 'success' && needs.export-vyper-tests.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base) }}
    needs: [select-source, test-deps, export-vyper-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The cache login is a secret of the bazel-cache environment, which main
    # (approved PR heads included), merge-queue and pull request refs may
    # deploy to.
    environment: ${{ (needs.select-source.outputs.approved == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || github.event_name == 'pull_request') && 'bazel-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.select-source.outputs.repository }}
          ref: ${{ needs.select-source.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project
        with:
          cache-key-suffix: ${{ env.CACHE_KEY_SUFFIX }}
          snapshot-key: ${{ needs.test-deps.outputs.holbuild-cache-key }}

      - name: Restore Vyper test exports
        uses: actions/cache/restore@v6
        with:
          path: tests/vyper-test-exports
          key: ${{ needs.export-vyper-tests.outputs.export-cache-key }}
          fail-on-cache-miss: true

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ !env.CACHE_KEY_SUFFIX && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build Vyper test coverage baseline
        if: matrix.group == 0
        run: holbuild build --skip-checkpoints --skip-proof-steps vyperTestCoverageReportTheory

      - name: Report Vyper test coverage baseline
        if: matrix.group == 0
        run: cat tests/vyper-coverage-report.txt

      - name: Run Vyper test group ${{ matrix.group }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Groups come from .github/vyper-test-groups.txt, balanced by measured
          # build time; rerun `tools/vyper_test_groups.py plan` when tests change.
          targets=$(python3 tools/vyper_test_groups.py targets --group ${{ matrix.group }} --groups ${{ strategy.job-total }})
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild test run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

  holbuild-success:
    # Renamed on a no-op edit, as build is.
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'holbuild-success (no-op edit)' || 'holbuild-success' }}
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-24.04
    needs: [select-source, toolchain, build, compiler, witnesses, build-rollup, tested, test-deps, python-o1-oracle, export-vyper-tests, vyper-tests]
    steps:
      - name: Check all jobs succeeded
        env:
          # Skipped unless a PR head is approved; a failed approval fails the run.
          SOURCE_RESULT: ${{ needs.select-source.result }}
          BUILD_RESULTS: ${{ needs.toolchain.result }} ${{ needs.build.result }} ${{ needs.compiler.result }} ${{ needs.witnesses.result }} ${{ needs.build-rollup.result }}
          TEST_RESULTS: ${{ needs.test-deps.result }} ${{ needs.python-o1-oracle.result }} ${{ needs.export-vyper-tests.result }} ${{ needs.vyper-tests.result }}
          MERGE_GROUP_PASSED: ${{ needs.tested.outputs.merge-group-passed }}
        run: |
          [ "$SOURCE_RESULT" = success ] || [ "$SOURCE_RESULT" = skipped ] || exit 1
          for result in $BUILD_RESULTS; do
            [ "$result" = success ] || exit 1
          done
          for result in $TEST_RESULTS; do
            [ "$result" = success ] || { [ "$result" = skipped ] && [ "$MERGE_GROUP_PASSED" = true ]; } || exit 1
          done

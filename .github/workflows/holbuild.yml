name: holbuild

on:
  workflow_dispatch:
  pull_request:
    # Only ready PRs into main from branches of this repository run jobs:
    # pushing a branch here needs write access, and those runs get the cache
    # login. Fork and draft PRs run nothing; the merge queue tests them. PRs
    # into other branches run nothing either; their base's own PR into main
    # tests them together.
    # ready_for_review starts CI when a draft is marked ready; converted_to_draft
    # cancels the run of a PR turned back into a draft. Omit edited: title/body
    # edits create all-skipped runs that shadow passing required checks.
    # After retargeting a ready PR to main without a push, start CI with
    # gh pr ready --undo && gh pr ready.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HBX_BASENAME: vyper-hol
  HBX_ARTEFACT_NAME: vyper-hol-hbx-${{ github.sha }}

jobs:
  build:
    # A push to main builds even when its tree passed, to publish main's
    # theories and HBX archive.
    needs: tested
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.tested.outputs.passed != 'true') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: No theorem-tag or hypothesis checks in sources (use holbuild check)
        run: |
          # The listed tests check conversion results, not stored theorems.
          if git grep -nE 'Tag\.dest_tag|Thm\.tag' -- '*.sml' ||
             git grep -nE 'null *\((Thm\.)?hyp\b' -- '*Script.sml' \
               ':!tests/jsonFrontendCVBenchmarkScript.sml' \
               ':!tests/vyperCheckContractLibTestScript.sml' \
               ':!tests/vyperExternalHeadersTestScript.sml' \
               ':!tests/vyperImmutableMutationTestScript.sml'; then
            echo "Check theorems with holbuild check: add a selector to .github/holbuild-check-targets.txt" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build project with holbuild
        env:
          TMPDIR: ${{ runner.temp }}
        run: holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps

      - name: Check listed theories and theorems for cheats and axioms
        run: holbuild check $(grep -v '^#' .github/holbuild-check-targets.txt)

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      # release.yml promotes only the archive of a main commit.
      - name: Export HBX archive
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          archive="$HBX_BASENAME.hbx"
          holbuild export --closure \
            -o "$archive" \
            --metadata-out "$archive.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload HBX artefact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.HBX_ARTEFACT_NAME }}
          path: |
            ${{ env.HBX_BASENAME }}.hbx
            ${{ env.HBX_BASENAME }}.hbx.json
            ${{ env.HBX_BASENAME }}.hbx.sha256
          if-no-files-found: error
          retention-days: 90

  native-parity:
    # Compiles every bytecode fixture with the extracted compiler and compares
    # it with the pinned Python compiler's output (bytecode/native/README.md).
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Check native runtime primitives
        working-directory: bytecode/native
        run: poly --script compilerNativeRuntimeTest.sml

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build native bytecode parity runner
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps compilerNativeEmitTheory
          holbuild -j"$(nproc)" executable bytecode_parity_native

      - name: Check native bytecode parity
        working-directory: bytecode
        run: ./native/bytecode_parity_native.exe .

  tested:
    # Whether a run already passed this tree, so this one skips the checks.
    # On a push to main: a merge-group run of this commit, since the merge
    # queue fast-forwards main to the commit it tested. In a merge group: a
    # pull-request run of the PR head whose tested merge with its base had
    # this group commit's tree.
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.runs.outputs.passed }}
    steps:
      - name: Find a successful run of this tree
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs="repos/$REPO/actions/workflows/holbuild.yml/runs"
          passed=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            count=$(gh api "$runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" -q .total_count)
            echo "successful merge-group runs: $count"
            [ "$count" -gt 0 ] && passed=true
          else
            # The group's merge commit has the PR head as its second parent.
            read -r tree head <<< "$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" -q '[.tree.sha, .parents[1].sha] | join(" ")')"
            echo "group tree $tree, PR head $head"
            for id in $(gh api "$runs?head_sha=$head&event=pull_request&status=success" -q '.workflow_runs[].id'); do
              # A draft's run succeeds with every job skipped, so take only a
              # successful holbuild-success, whose step names the commit tested.
              tested=$(gh api "repos/$REPO/actions/runs/$id/jobs" -q '.jobs[] | select(.name == "holbuild-success" and .conclusion == "success") | .steps[].name | select(startswith("Check all jobs succeeded on ")) | ltrimstr("Check all jobs succeeded on ")')
              [ -n "$tested" ] || continue
              tested_tree=$(gh api "repos/$REPO/git/commits/$tested" -q .tree.sha)
              echo "pull-request run $id passed $tested, tree $tested_tree"
              if [ "$tested_tree" = "$tree" ]; then passed=true; break; fi
            done
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  test-deps:
    # Builds only what the test groups load besides their own theories, so they
    # start long before build finishes.
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build test dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          targets=$(python3 tools/ci_targets.py)
          echo "Building: $targets"
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps $targets

  python-o1-oracle:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.17'

      - name: Check independent pinned-Python O1/no-assembly-opt bytecode oracle
        run: |
          python -m pip install uv==0.10.11
          pin=$(tr -d '[:space:]' < VYPER_PIN)
          git clone https://github.com/vyperlang/vyper.git vyper-src
          git -C vyper-src checkout --detach "$pin"
          sh bytecode/python-o1-bytecode-fixtures --check \
            --vyper-repo vyper-src

  export-vyper-tests:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.passed != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vyper-test-exports

      - name: Upload Vyper test exports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vyper-test-exports-${{ github.sha }}
          path: tests/vyper-test-exports
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  save-vyper-test-exports:
    # Pull-request and merge-queue runs can restore a cache only from their own
    # ref or from main, and export-vyper-tests is skipped on a push whose merge
    # group passed, so this job keeps main's test-export cache: it restores it
    # in seconds, or generates and saves it once per pin and export profile.
    # holbuild-success doesn't need it.
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vyper-test-exports

  export-parity:
    # Compiles every contract of the Vyper test exports natively and compares
    # the bytes with the patched pinned Vyper's (tools/native_export_parity.py).
    if: ${{ !cancelled() && needs.export-vyper-tests.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: export-vyper-tests
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.17'

      - name: Download Vyper test exports
        uses: actions/download-artifact@v8.0.1
        with:
          name: vyper-test-exports-${{ github.sha }}
          path: tests/vyper-test-exports

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Build native JSON bytecode parity runner
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tools/build_native_json_parity.py

      - name: Install patched pinned Vyper
        run: |
          python -m pip install uv==0.10.11
          pin=$(tr -d '[:space:]' < VYPER_PIN)
          git clone https://github.com/vyperlang/vyper.git vyper-src
          git -C vyper-src checkout --detach "$pin"
          sh bytecode/python-o1-bytecode-fixtures --install "$RUNNER_TEMP/vyper-patched" \
            --vyper-repo vyper-src

      - name: Check native bytecode parity on the exported contracts
        run: |
          PYTHONHASHSEED=0 "$RUNNER_TEMP/vyper-patched/venv/bin/python" -P -s \
            tools/native_export_parity.py tests/vyper-test-exports "$RUNNER_TEMP/export-parity" \
            --report export-parity-report.txt

      - name: Summarize the per-contract report
        if: ${{ !cancelled() && hashFiles('export-parity-report.txt') != '' }}
        run: |
          {
            echo '```text'
            grep -v -E '^(match|outside|rejected) ' export-parity-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the per-contract report
        if: ${{ !cancelled() && hashFiles('export-parity-report.txt') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: export-parity-report-${{ github.sha }}
          path: export-parity-report.txt
          retention-days: 30

  vyper-tests:
    # tested, skipped on events other than push and merge_group, would skip
    # this job through the implicit success(); the result checks stand in for it.
    if: ${{ !cancelled() && needs.test-deps.result == 'success' && needs.export-vyper-tests.result == 'success' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [test-deps, export-vyper-tests]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    # The cache login is a secret of the bazel-cache environment, which every
    # branch of this repository may deploy to.
    environment: bazel-cache
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-holbuild-project

      - name: Download Vyper test exports
        uses: actions/download-artifact@v8.0.1
        with:
          name: vyper-test-exports-${{ github.sha }}
          path: tests/vyper-test-exports

      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG }}

      - name: Generate test theories from pinned exports
        run: |
          holbuild --max-heap 4096 build --skip-checkpoints --skip-proof-steps vyperTestLibTestTheory
          generator=$(mktemp --suffix=.sml)
          trap 'rm -f "$generator"' EXIT
          printf '%s\n' 'vyperTestLib.generate_tests ();' > "$generator"
          (cd tests && holbuild --max-heap 4096 run --noconfig vyperTestLib "$generator")

      - name: Check generated Vyper script inventory
        run: |
          holbuild --max-heap 4096 run --noconfig tests/checkGeneratedScripts.sml

      - name: Build Vyper test coverage baseline
        if: matrix.group == 0
        run: holbuild --max-heap 4096 build --skip-checkpoints --skip-proof-steps vyperTestCoverageReportTheory

      - name: Report Vyper test coverage baseline
        if: matrix.group == 0
        run: cat tests/vyper-coverage-report.txt

      - name: Run Vyper test group ${{ matrix.group }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Groups come from .github/vyper-test-groups.txt, balanced by measured
          # build time; rerun `tools/vyper_test_groups.py plan` when tests change.
          targets=$(python3 tools/vyper_test_groups.py targets --group ${{ matrix.group }} --groups ${{ strategy.job-total }})
          echo "Building: $targets"
          # Leave RAM for the runner and dependency loading, not just ML heaps.
          jobs=$(nproc)
          if [ "$jobs" -gt 2 ]; then jobs=2; fi
          memory_mib=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1024 / 1024 ))
          if [ "$memory_mib" -lt 12288 ]; then jobs=1; fi
          holbuild --max-heap 4096 --verbose -j"$jobs" build --skip-checkpoints --skip-proof-steps $targets

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild test run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

  holbuild-success:
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04-arm
    needs: [build, native-parity, tested, test-deps, python-o1-oracle, export-vyper-tests, export-parity, vyper-tests]
    steps:
      # A merge group's tested job reads the commit from this step's name.
      - name: Check all jobs succeeded on ${{ github.sha }}
        env:
          RESULTS: ${{ needs.build.result }} ${{ needs.native-parity.result }} ${{ needs.test-deps.result }} ${{ needs.python-o1-oracle.result }} ${{ needs.export-vyper-tests.result }} ${{ needs.export-parity.result }} ${{ needs.vyper-tests.result }}
          PASSED: ${{ needs.tested.outputs.passed }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { [ "$result" = skipped ] && [ "$PASSED" = true ]; } || exit 1
          done

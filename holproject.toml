[holbuild]
minimum_version = "0.11.3"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = ["vyperHolScript.sml",
         "tests/vyperCheckContractLibTestScript.sml",
         "tests/vyperStringScopeTestScript.sml",
         "frontend/vyperCheckContractFrontendLibTestScript.sml",
         "frontend/jsonConstEvalWitnessScript.sml",
         "frontend/foldedValueValidationPrepScript.sml",
         "tests/vyperCheckContractTraceLibTestScript.sml",
         "tests/vyperCreateSelfdestructScript.sml",
         "tests/vyperTestLibTestScript.sml",
         "tests/vyperCalldataLenTestScript.sml",
         "tests/vyperInvertTestScript.sml",
         "tests/vyperInStaticArrayTestScript.sml",
         "tests/vyperCalldataSliceTestScript.sml",
         "tests/vyperRawCallCalldataTestScript.sml",
         "tests/vyperDelegateRawCallTestScript.sml",
         "tests/vyperTupleSubscriptTestScript.sml",
         "tests/vyperExtCallModesTestScript.sml",
         "tests/vyperUnreachableTestScript.sml",
         "tests/vyperECPrecompileTestScript.sml",
         "tests/vyperPopReceiverTestScript.sml",
         "lowering/supported/supportedTypePropsScript.sml",
         "lowering/supported/supportedNamePropsScript.sml",
         "lowering/supported/supportedDeclPropsScript.sml",
         "lowering/supported/supportedExprFormPropsScript.sml",
         "lowering/supported/supportedExprPropsScript.sml",
         "lowering/supported/supportedStmtPropsScript.sml",
         "lowering/supported/supportedStmtTraversePropsScript.sml",
         "lowering/supported/supportedProgramPropsScript.sml"]

# Preload the toolchain context before intLib loads hurdUtils. Its legacy
# module manifest otherwise reaches hurdUtils.sml before this structure exists.
[actions]
supportedExprFormPropsTheory = { loads = ["hurdUtilsContextTheory"] }
vyperEvalMiscTheory = { loads = ["hurdUtilsContextTheory"] }
vyperEvalBinopTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeBindArgumentsTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeGlobalLookupSoundnessTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeAssignContextTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeExtCallSoundnessTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeEvalSoundnessTheory = { loads = ["hurdUtilsContextTheory"] }
vyperTypeStmtSoundnessTheory = { loads = ["hurdUtilsContextTheory"] }
jsonToVyperTypeTheory = { loads = ["hurdUtilsContextTheory"] }
jsonToVyperExprTheory = { loads = ["hurdUtilsContextTheory"] }
jsonToVyperTopLevelTheory = { loads = ["hurdUtilsContextTheory"] }
jsonToVyperTheory = { loads = ["hurdUtilsContextTheory"] }

[dependencies.verifereum]
git = "https://github.com/verifereum/verifereum.git"
rev = "f5e172ccbf45addef7096feea76428de3ed3dfa8"

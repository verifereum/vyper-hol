[holbuild]
minimum_version = "0.11.3"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = ["vyperHolScript.sml",
         "semantics/type/vyperCheckContractLibTestScript.sml",
         "frontend/vyperCheckContractFrontendLibTestScript.sml",
         "tests/vyperCheckContractTraceLibTestScript.sml",
         "tests/vyperCalldataLenTestScript.sml",
         "tests/vyperCalldataSliceTestScript.sml"]

[build.theory_tactic_timeouts]
"semantics/vyperInterpreterScript.sml" = 5
"semantics/prop/vyperLogPreservationScript.sml" = 5
"venom/defs/venomExecSemanticsScript.sml" = 5
"venom/proofs/execEquivProofsScript.sml" = 5

[dependencies.verifereum]
git = "https://github.com/verifereum/verifereum.git"
rev = "f5e172ccbf45addef7096feea76428de3ed3dfa8"

[holbuild]
minimum_version = "0.12.0"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = [
  # the results: semantics, analyses, passes, lowering and compiler proofs
  "vyperHolScript.sml",
  # whitelist-removal leaves awaiting integration into the stage proofs
  "lowering/whitelist/whitelistDeployScript.sml",
  "lowering/whitelist/whitelistVisibilityScript.sml",
  "lowering/whitelist/whitelistExprOpenScript.sml",
  "lowering/whitelist/whitelistS2ExtrasScript.sml",
  "lowering/whitelist/whitelistCheckerTypesScript.sml",
  "lowering/whitelist/whitelistCheckerDeclsScript.sml",
  "lowering/whitelist/whitelistFlagsScript.sml",
  "lowering/whitelist/whitelistForIterScript.sml",
  "lowering/whitelist/whitelistScopesScript.sml",
  "lowering/whitelist/whitelistLogWidenScript.sml",
  # hand-written tests of the semantics, frontend and test runner
  "tests/vyperTestsHolScript.sml",
  # concrete checks of the lowering and compiler
  "lowering/loweringChecksScript.sml",
  # concrete checks of Venom execution, the passes and codegen
  "venom/venomChecksScript.sml",
]

[[executable]]
name = "bytecode_parity_native"
output = "bytecode/native/bytecode_parity_native.exe"
objects = ["compilerNativeParity"]

[actions.compilerNativeParity]
deps = ["compilerNativeEmitTheory"]

[dependencies.verifereum]
git = "https://github.com/verifereum/verifereum.git"
rev = "47a9174eb5214df0837b3cf3ca42f12c68b39abb"

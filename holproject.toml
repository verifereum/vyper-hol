[holbuild]
minimum_version = "0.12.0"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = ["vyperHolScript.sml",
         "tests/selfdestructReturnDataTestScript.sml",
         "tests/vyperPopTypingTestScript.sml",
         "venom/proofs/allocaHistoryScript.sml",
         "lowering/allocaHistoryFragmentScript.sml",
         "lowering/nonreentrantEntryScript.sml",
         "lowering/nonreentrantSourceScript.sml",
         "lowering/nonreentrantExitScript.sml",
         "lowering/concatMemoryScript.sml",
         "tests/vyperTestsHolScript.sml",
         "lowering/e2eBoundaryTestScript.sml",
         "lowering/evalCompilerWitnessesScript.sml",
         "tests/conversionProofAuditScript.sml",
         "lowering/targetPlaceTestScript.sml",
         "lowering/targetPlaceSimCasesScript.sml",
         "lowering/bodyMemoryDefsScript.sml",
         "lowering/entryHaltMemScript.sml",
         "lowering/loweringMemCorrectScript.sml",
         "lowering/builtinBytesMemoryScript.sml",
         "venom/passes/dft/tests/dftEffectOrderTestScript.sml",
         "lowering/defs/bytecode/eval/evalCompilerAbiTupleStringScript.sml",
         "lowering/defs/bytecode/eval/evalCompilerAbiCodegenScript.sml",
         "lowering/defs/bytecode/eval/evalCompilerRangeScript.sml",
         "lowering/abiProofsScript.sml",
         "lowering/supported/supportedTypePropsScript.sml",
         "lowering/supported/supportedNamePropsScript.sml",
         "lowering/supported/supportedDeclPropsScript.sml",
         "lowering/supported/supportedExprFormPropsScript.sml",
         "lowering/supported/supportedExprPropsScript.sml",
         "lowering/supported/supportedStmtPropsScript.sml",
         "lowering/supported/supportedStmtTraversePropsScript.sml",
         "lowering/supported/supportedProgramPropsScript.sml",
         "venom/codegen/proofs/contextReachabilityChecksScript.sml",
         "venom/codegen/proofs/genFrameSimScript.sml",
         "tests/vyperPlaceProbesTestScript.sml",
         "tests/vyperPlaceSanityTestScript.sml"]

[[executable]]
name = "bytecode_parity_native"
output = "lowering/defs/bytecode/native/bytecode_parity_native.exe"
objects = ["compilerNativeParity"]

[actions.compilerNativeParity]
deps = ["compilerNativeEmitTheory"]

[dependencies.verifereum]
git = "https://github.com/verifereum/verifereum.git"
rev = "47a9174eb5214df0837b3cf3ca42f12c68b39abb"

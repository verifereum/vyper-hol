[holbuild]
minimum_version = "0.11.5"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = ["vyperHolScript.sml",
         "lowering/evalCompilerWitnessesScript.sml",
         "tests/vyperCheckContractLibTestScript.sml",
         "tests/vyperStringScopeTestScript.sml",
         "frontend/vyperCheckContractFrontendLibTestScript.sml",
         "frontend/jsonConstEvalWitnessScript.sml",
         "frontend/sourceConstASTLibTestScript.sml",
         "frontend/sourceConstEvalPropsScript.sml",
         "frontend/sourceConstBuiltinTestScript.sml",
         "frontend/sourceConstEnvTestScript.sml",
         "frontend/sourceConstValueTestScript.sml",
         "frontend/sourceSyntaxLibTestScript.sml",
         "frontend/sourceResolveTestScript.sml",
         "frontend/sourceTypeTestScript.sml",
         "frontend/sourceTypeProvenanceScript.sml",
         "frontend/sourceTypeFrontendLibTestScript.sml",
         "frontend/sourceModuleLinkTestScript.sml",
         "frontend/sourceModuleLoaderTestScript.sml",
         "frontend/sourceModulePolicyTestScript.sml",
         "frontend/sourceOrdinaryBridgeTestScript.sml",
         "frontend/sourceOrdinaryClaimsTestScript.sml",
         "tests/sourceOrdinaryProgramCoreTestScript.sml",
         "tests/sourceOrdinaryProgramExprTestScript.sml",
         "tests/sourceOrdinaryProgramModulesTestScript.sml",
         "tests/sourceOrdinaryProgramPolicyTestScript.sml",
         "tests/sourceOrdinaryProgramLargeTestScript.sml",
         "tests/sourceOrdinaryProgramInventoryTestScript.sml",
         "tests/sourceOrdinaryProgramBoundaryTestScript.sml",
         "tests/sourceOrdinaryProgramParityTestScript.sml",
         "tests/sourceOrdinaryProgramWitnessTestScript.sml",
         "frontend/sourceOrdinarySupportScript.sml",
         "tests/sourceShiftCountTestScript.sml",
         "tests/sourceShiftCountFrontendTestScript.sml",
         "tests/sourceAddressHexExprTestScript.sml",
         "tests/sourceAddressHexTestScript.sml",
         "frontend/sourceElaborationAuditScript.sml",
         "frontend/foldedValueValidationPrepScript.sml",
         "tests/vyperCheckContractTraceLibTestScript.sml",
         "tests/vyperCreateSelfdestructScript.sml",
         "tests/vyperTestLibTestScript.sml",
         "tests/vyperCalldataLenTestScript.sml",
         "tests/vyperInvertTestScript.sml",
         "tests/vyperInStaticArrayTestScript.sml",
         "tests/vyperCalldataSliceTestScript.sml",
         "tests/vyperRawCallCalldataTestScript.sml",
         "tests/vyperDelegateRawCallTestScript.sml",
         "tests/vyperTupleSubscriptTestScript.sml",
         "tests/vyperImmutableMutationTestScript.sml",

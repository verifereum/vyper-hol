[holbuild]
minimum_version = "0.12.0"

[project]
name = "vyper-hol"
version = "0.2.3"

[build]
roots = [
  # the results: semantics, analyses, passes, lowering and compiler proofs
  "vyperHolScript.sml",
  # hand-written tests of the semantics, frontend and test runner
  "tests/vyperTestsHolScript.sml",
  # concrete checks of the lowering and compiler: parity, membership, audits
  "lowering/loweringChecksScript.sml",
  # concrete checks of Venom execution, the passes and codegen
  "venom/venomChecksScript.sml",
  # pinned-Python bytecode witnesses, a root of their own so CI can shard them
  "lowering/evalCompilerWitnessesScript.sml",
]

[[executable]]
name = "bytecode_parity_native"
output = "lowering/defs/bytecode/native/bytecode_parity_native.exe"
objects = ["compilerNativeParity"]

[actions.compilerNativeParity]
deps = ["compilerNativeEmitTheory"]

[dependencies.verifereum]
git = "https://github.com/verifereum/verifereum.git"
rev = "482e153ced02607fd5682b34260f540648d0032f"

# Functor parameter signatures are not inferred by HOL's module scanner.
[actions.JsonASTDecodeFn]
loads = ["jsonImportTerm"]

[actions.JsonTraceDecodeFn]
loads = ["jsonImportTerm"]

[actions.JsonImportHol]
loads = ["jsonImportTerm"]

[actions.jsonASTLib]
loads = ["jsonImportTerm", "JsonImportHol", "JsonASTDecodeFn"]

[actions.vyperTestLib]
loads = ["jsonImportTerm", "JsonTraceDecodeFn"]

[actions.vyperJsonReplayLib]
loads = ["jsonImportTerm", "jsonASTLib", "JsonTraceDecodeFn", "jsonDocumentLib"]
